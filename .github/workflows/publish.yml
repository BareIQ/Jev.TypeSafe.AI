name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write # create the GitHub release
      id-token: write # NuGet trusted publishing (OIDC)
    env:
      NUGET_USER: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
    steps:
      - name: Validate NuGet publishing configuration
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set the NUGET_USER variable in the nuget environment or repository settings to the NuGet username used by the trusted publishing policy."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Derive version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "Tag ${GITHUB_REF_NAME} is not a valid SemVer tag (vX.Y.Z[-suffix])"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: dotnet build -c Release -p:Version=$VERSION
      - run: dotnet test --project tests/Jev.TypeSafe.Tests -c Release --no-build
      - run: dotnet test --project tests/Jev.TypeSafe.Extensions.Tests -c Release --no-build
      - run: dotnet pack src/Jev.TypeSafe -c Release --no-build -p:Version=$VERSION -o artifacts
      - run: dotnet pack src/Jev.TypeSafe.Extensions -c Release --no-build -p:Version=$VERSION -o artifacts
      - name: Authenticate to NuGet (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}
      - name: Push packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" artifacts/* --generate-notes $prerelease
